version: "3.9"

# Segredos NÃO são versionados: define-os num ficheiro .env na raiz do projeto
# (o docker compose lê-o automaticamente). Ver .env.example para o template.
# A sintaxe ${VAR:?mensagem} faz o compose falhar de imediato se a variável
# estiver em falta, em vez de arrancar com um valor por defeito inseguro.
services:
  db:
    image: postgres:16
    container_name: fittraining_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fittraining}
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD no .env}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432" # Use 5433 on host to avoid conflict with Guacamole

  app:
    build: .
    container_name: fittraining_app
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fittraining}?schema=public
      - JWT_SECRET=${JWT_SECRET:?define JWT_SECRET no .env}
      - PORT=${PORT:-8510}
      - POLLINATIONS_API_KEY=${POLLINATIONS_API_KEY:?define POLLINATIONS_API_KEY no .env}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "${PORT:-8510}:${PORT:-8510}"
